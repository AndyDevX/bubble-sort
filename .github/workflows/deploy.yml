# Publica el juego en GitHub Pages en cada push a main.
# Activación (una vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos pushes seguidos, se publica solo el último
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Cada despliegue es un build nuevo: se muestra en el menú del juego
          VITE_NUMERO_BUILD: ${{ github.run_number }}
          VITE_COMMIT: ${{ github.sha }}

      # Actualización en caliente para la app Android (src/sistemas/actualizaciones.ts): el build
      # comprimido y version.json, que la app consulta al abrirse
      - name: Paquete de actualización para la app
        run: |
          version=$(node -p "require('./package.json').version")
          zip_nombre="odi-sort-$version.zip"
          (cd dist && zip -qr "$RUNNER_TEMP/$zip_nombre" .)
          mkdir -p dist/actualizacion
          mv "$RUNNER_TEMP/$zip_nombre" dist/actualizacion/
          node -e "require('fs').writeFileSync('dist/actualizacion/version.json', JSON.stringify({ version: '$version', build: ${{ github.run_number }}, commit: '${{ github.sha }}', zip: '$zip_nombre' }, null, 2))"
          cat dist/actualizacion/version.json
          ls -la dist/actualizacion

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
